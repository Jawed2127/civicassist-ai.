services:
  # 1. Django Backend Web Service
  - type: web
    name: civicassist-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn civicassist.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: civicassist-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://civicassist-frontend.onrender.com,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

  # 2. React Frontend Static Site
  - type: web
    name: civicassist-frontend
    env: static
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://civicassist-backend.onrender.com/api"

databases:
  # 3. Managed PostgreSQL Database
  - name: civicassist-db
    region: oregon
    plan: starter
    databaseName: civicassist_db
    user: civicassist_user
