version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: civicassist_db
    restart: always
    environment:
      POSTGRES_DB: civicassist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicassist_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python seed_data.py &&
             gunicorn civicassist.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DEBUG=False
      - SECRET_KEY=production-civicassist-change-this-key-in-prod
      - ALLOWED_HOSTS=*
      - USE_POSTGRES=True
      - DB_NAME=civicassist_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - CSRF_TRUSTED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicassist_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
